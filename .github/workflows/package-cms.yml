name: Package CMS artifact

on:
  workflow_dispatch:
  push:
    tags:
      - 'cms-v*'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx nx run aem-packaging:package
      - uses: actions/upload-artifact@v4
        with:
          name: angular-app-cms
          path: dist/cms/angular-app-*.zip
